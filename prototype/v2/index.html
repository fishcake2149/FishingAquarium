<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#172b2d" />
  <title>낚시 아쿠아리움 — 연못 마을 통합 프로토타입</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <section id="gameShell" aria-label="낚시 아쿠아리움 게임 화면">
      <div id="worldLayer">
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <div id="topHud" class="hudBox">
          <div class="hudLocation" id="locationText">연못 마을 · 버스정류장</div>
          <div class="hudStatus"><span id="clockText">1일 · 08:00</span><span id="weatherText">☀ 맑음</span></div>
          <div class="hudButtons">
            <button data-panel="inventoryPanel">🎒 인벤토리</button>
            <button data-panel="codexPanel">📖 도감</button>
            <button data-panel="equipmentPanel">🎣 장비</button>
            <button data-panel="aquariumStatusPanel">🐠 아쿠아리움</button>
          </div>
        </div>

        <div id="moneyHud" class="hudBox"><b id="moneyText">0G</b><span id="pendingRevenueText">정산 대기 0G</span></div>

        <div id="bagHud" class="hudBox" aria-label="9칸 가방">
          <div class="bagHeader"><span>가방</span><span id="bagUsage">0/9</span></div>
          <div id="bagMiniGrid" class="bagMiniGrid"></div>
        </div>

        <div id="castGaugeWrap" class="castGaugeWrap hidden">
          <div class="castTitle">캐스팅</div>
          <div class="castGaugeTrack"><div id="castGaugeFill"></div><div id="castGaugeMarker"></div></div>
          <div class="castHint" id="castHint">좌클릭을 떼는 순간의 거리로 찌가 날아갑니다.</div>
        </div>

        <div id="toast" class="toast hidden"></div>
        <button id="resetButton" class="resetButton" title="저장 데이터를 초기화">↻ 초기화</button>
      </div>

      <div id="modalLayer" class="modalLayer hidden" aria-live="polite">
        <div id="modalBackdrop" class="modalBackdrop"></div>
        <section id="modalCard" class="modalCard">
          <button id="modalClose" class="modalClose" aria-label="닫기">×</button>
          <div id="modalContent"></div>
        </section>
      </div>

      <div id="fishingOverlay" class="fishingOverlay hidden">
        <canvas id="fishingCanvas" width="540" height="540"></canvas>
        <div class="fishingReadout">
          <div><b id="fishingSpecies">붕어</b> <span id="fishingDifficulty">난이도 1</span></div>
          <div class="catchGauge"><div id="catchGaugeFill"></div></div>
          <div class="fishingHint">좌클릭 홀드 = 시계 방향 · 떼기 = 반시계 방향</div>
          <button id="iceBombButton">❄ 얼음 폭탄 <span id="iceBombCount">×0</span></button>
        </div>
      </div>
    </section>

    <p class="controls">이동 <b>WASD</b> · 상호작용/낚시 <b>마우스 좌클릭</b> · 닫기 <b>ESC</b></p>
  </main>
  <script src="./game-source.js"></script>
  <script src="./map-fix.js"></script>
  <script src="./input-fix.js"></script>
  <script src="./movement-fix.js"></script>
</body>
</html>
