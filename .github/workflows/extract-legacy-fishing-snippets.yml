name: Extract legacy fishing snippets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-legacy-fishing-snippets.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant fishing code
        shell: python
        run: |
          from pathlib import Path
          src=Path('prototype/legacy-original-readable.html').read_text(encoding='utf-8').splitlines()
          needles=['BAR_ACCEL','barAngle','barSpeed','catchGauge','fishAngle','fishVel','fishTarget','inside','pointerDown','mousedown','mouseup','catchBar','barSize','barArc','zone']
          hits=set()
          for i,line in enumerate(src):
              if any(n.lower() in line.lower() for n in needles):
                  for j in range(max(0,i-5),min(len(src),i+7)):
                      hits.add(j)
          out=[]
          last=-2
          for j in sorted(hits):
              if j>last+1: out.append('\n---\n')
              out.append(f'{j+1:04d}: {src[j]}')
              last=j
          Path('prototype/legacy-fishing-snippets.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit snippets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/legacy-fishing-snippets.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract legacy fishing control snippets'
          git push
