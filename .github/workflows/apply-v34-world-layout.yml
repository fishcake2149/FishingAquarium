name: Apply v3.4 world layout overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v34-world-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply layout patch
        run: python .github/scripts/apply_v34_world_layout.py
      - name: Syntax check
        run: node --check prototype/v3/game-v31-source.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/v3/game-v31-source.js prototype/v3/index.html
          git commit -m "Rebuild village as overlook stairway and lower town" || exit 0
          git push
