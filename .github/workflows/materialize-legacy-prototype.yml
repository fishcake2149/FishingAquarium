name: Materialize legacy fishing prototype
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-legacy-prototype.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode legacy wrapper
        shell: python
        run: |
          import re, base64, gzip
          from pathlib import Path
          p=Path('prototype/aquarium_fishing_prototype_reset_button.html')
          text=p.read_text(encoding='utf-8')
          m=re.search(r"atob\('([^']+)'\)", text)
          if not m:
              raise SystemExit('legacy base64 payload not found')
          html=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          Path('prototype/legacy-original-readable.html').write_text(html, encoding='utf-8')
      - name: Commit readable legacy source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/legacy-original-readable.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize readable legacy fishing prototype'
          git push
