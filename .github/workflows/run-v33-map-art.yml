name: Run v3.3 map art patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v33_map_art.py'
      - '.github/workflows/run-v33-map-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_v33_map_art.py
      - name: Syntax check
        run: node --check prototype/v3/game-v31-source.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/v3/game-v31-source.js prototype/v3/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Overhaul village terrain pond and building depth'
          git push
