name: Apply v3.10 bobber retrieve before bite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v35-bus-road.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add bobber retrieval before fishing minigame
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('prototype/v3/game-v31-source.js')
          s = p.read_text(encoding='utf-8')

          old = "if(cast.mode==='charging'){releaseCast();return}if(cast.mode==='waiting')return;handleWorldClick()"
          new = "if(cast.mode==='charging'){releaseCast();return}if(cast.mode==='waiting'){resetCast();showToast('찌를 회수했습니다.');return}handleWorldClick()"
          assert old in s, 'pointerup waiting-cast handler not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          index = Path('prototype/v3/index.html')
          h = index.read_text(encoding='utf-8')
          h = re.sub(r'game-v31-source\.js\?v=[^\"\']+', 'game-v31-source.js?v=20260915-12', h, count=1)
          index.write_text(h, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check prototype/v3/game-v31-source.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/v3/game-v31-source.js prototype/v3/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Allow bobber retrieval before bite"
            git push
          fi
