name: Apply v3.7 straight road and full upper forest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v35-bus-road.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild road, paths, and dark forest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('prototype/v3/game-v31-source.js')
          s=p.read_text(encoding='utf-8')

          # 1) Road geometry: one continuous horizontal line above the bus stop.
          s,n=re.subn(
              r"addRoadH\([^\n]+?;addRoadH\([^\n]+?;\n// Upper walking route:",
              "addRoadH(0,42,7,2);addRoadH(4,10,9,2);\n// Upper walking route:",
              s,count=1
          )
          assert n==1, f'road geometry patch {n}'

          # 2) Make the walking paths unmistakable and tile-aligned.
          old_upper="addV(14,18,7,3);addH(7,23,18,3);addV(16,18,23,3);addH(23,31,20,3);addV(20,36,31,2);"
          new_upper="addV(14,18,7,3);addH(7,23,18,3);addV(16,18,23,3);addH(23,31,20,3);addV(20,36,31,3);"
          if old_upper in s:
              s=s.replace(old_upper,new_upper,1)

          # 3) Dense conifers on both stair slopes.
          conifers="""const conifers=(()=>{
  const out=[];
  const fill=(x1,x2,y1,y2,dx,dy,phase)=>{
    let row=0;
    for(let ty=y1;ty<=y2;ty+=dy,row++){
      const shift=(row%2)*dx*.45;
      for(let tx=x1+shift;tx<=x2;tx+=dx){
        const wobbleX=Math.sin((tx*6.4+ty*3.7+phase))*.08;
        const wobbleY=Math.cos((tx*3.9-ty*5.1+phase))*.08;
        const size=.98+((Math.sin(tx*2.1+ty*1.6+phase)+1)*.5)*.30;
        out.push({tx:tx+wobbleX,ty:ty+wobbleY,s:size});
      }
    }
  };
  fill(21.8,28.4,21.5,36.4,.88,.92,.4);
  fill(34.1,41.8,21.5,36.4,.88,.92,2.2);
  return out;
})();
const darkForest=(()=>{
  const out=[];
  let row=0;
  for(let ty=1.2;ty<=38;ty+=.92,row++){
    const shift=(row%2)*.46;
    for(let tx=.4+shift;tx<=44;tx+=.92){
      const x=tx*TILE,y=ty*TILE;
      if(isVillageLandPoint(x,y))continue;
      const size=1.03+((Math.sin(tx*1.9+ty*2.4)+1)*.5)*.28;
      out.push({tx:tx+Math.sin(tx*5.3+ty)*.07,ty:ty+Math.cos(ty*4.7-tx)*.07,s:size});
    }
  }
  return out;
})();"""
          s,n=re.subn(r"const conifers=\(\(\)=>\{.*?\n\}\)\(\);",conifers,s,count=1,flags=re.S)
          assert n==1, f'conifer patch {n}'

          # 4) Draw an obviously straight asphalt road, not a stepped/diagonal pattern.
          road_draw="""function drawRoadTiles(){
  ctx.save();
  const x0=-camera.x,y0=7*TILE-camera.y,w=42*TILE,h=2*TILE;
  ctx.fillStyle='#a89473';ctx.fillRect(x0-4,y0-5,w+8,h+10);
  ctx.fillStyle='#505758';ctx.fillRect(x0,y0,w,h);
  ctx.fillStyle='rgba(220,225,218,.12)';ctx.fillRect(x0,y0+4,w,3);
  ctx.fillStyle='#d9ca83';
  for(let x=10;x<w-10;x+=46)ctx.fillRect(x0+x,y0+h/2-2,28,4);
  // bus pull-off connected to the straight road
  ctx.fillStyle='#a89473';ctx.fillRect(4*TILE-camera.x,9*TILE-camera.y,6*TILE,2*TILE+5);
  ctx.fillStyle='#505758';ctx.fillRect(4*TILE-camera.x,9*TILE-camera.y,6*TILE,2*TILE);
  ctx.restore();
}
"""
          s,n=re.subn(r"function drawRoadTiles\(\)\{.*?\n\}\nfunction drawConifer",road_draw+"function drawConifer",s,count=1,flags=re.S)
          assert n==1, f'road draw patch {n}'

          # 5) Render the dark-background forest BEFORE land, so every dark gap is filled
          # while paths/road/land remain clearly visible on top.
          marker="ctx.restore();\n  drawLandMass(UPPER_LAND,'#77a56b','#4c6548',26);"
          replacement="ctx.restore();\n  for(const t of darkForest)drawConifer(t);\n  drawLandMass(UPPER_LAND,'#77a56b','#4c6548',26);"
          assert marker in s, 'dark forest render marker missing'
          s=s.replace(marker,replacement,1)

          # 6) Brighten grid paths so they cannot disappear into the terrain.
          s=s.replace("['#c4a36d','#ceb07a','#b99a65','#d0b17a','#c6a872']","['#d9bd82','#e1c98f','#cfb276','#e4cb91','#d6bb7f']",1)
          s=s.replace("rgba(100,74,43,.2)","rgba(83,61,39,.38)",1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check prototype/v3/game-v31-source.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/v3/game-v31-source.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make bus road straight and fill dark terrain with forest"
            git push
          fi
