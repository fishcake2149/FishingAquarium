name: Apply v3.5 bus road and stair vegetation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v35-bus-road.yml'
      - 'tools/apply_v35_bus_road_trees.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply road, tile paths, and conifers
        run: python tools/apply_v35_bus_road_trees.py

      - name: Syntax check
        run: node --check prototype/v3/game-v31-source.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/v3/game-v31-source.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add bus road, grid paths, and stair conifers"
            git push
          fi
