name: Apply v3.8 continuous road and full dark forest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v35-bus-road.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extend road, reconnect paths, and fill all dark terrain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('prototype/v3/game-v31-source.js')
          s = p.read_text(encoding='utf-8')

          old_roads = "addRoadH(0,42,7,2);addRoadH(4,10,9,2);"
          new_roads = "addRoadH(0,111,7,2);addRoadH(4,10,9,3);"
          assert old_roads in s, 'road geometry not found'
          s = s.replace(old_roads, new_roads, 1)

          upper_old = "addV(14,18,7,3);addH(7,23,18,3);addV(16,18,23,3);addH(23,31,20,3);addV(20,36,31,3);"
          upper_new = "addV(14,18,7,3);addH(7,23,18,3);addV(16,20,23,3);addH(23,31,20,3);addV(20,40,31,3);"
          assert upper_old in s, 'upper path block not found'
          s = s.replace(upper_old, upper_new, 1)

          lower_old = "addV(35,40,31,3);addH(18,101,40,3);addV(40,54,30,3);addH(18,45,54,3);addV(54,64,30,3);addH(30,45,64,3);addV(40,58,99,3);addH(92,101,58,3);"
          lower_new = "addH(18,103,40,3);addV(38,40,43,3);addV(37,40,62,3);addV(38,40,86,3);addV(40,54,30,3);addH(18,45,54,3);addV(54,66,30,3);addH(30,45,66,3);addV(40,53,102,3);addH(99,102,53,3);addV(53,58,99,3);addH(92,102,58,3);"
          assert lower_old in s, 'lower path block not found'
          s = s.replace(lower_old, lower_new, 1)

          dense_forest = "\n".join([
              "const darkForest=(()=>{",
              "  const out=[];",
              "  let row=0;",
              "  for(let ty=-1.0;ty<=CONFIG.villageRows+2;ty+=.92,row++){",
              "    const shift=(row%2)*.46;",
              "    for(let tx=-1.2+shift;tx<=CONFIG.villageCols+1.5;tx+=.92){",
              "      const x=tx*TILE,y=ty*TILE;",
              "      if(isVillageLandPoint(x,y))continue;",
              "      const wave=(Math.sin(tx*1.87+ty*2.31)+1)*.5;",
              "      const size=1.38+wave*.30;",
              "      out.push({",
              "        tx:tx+Math.sin(tx*5.1+ty*1.3)*.08,",
              "        ty:ty+Math.cos(ty*4.6-tx*1.1)*.08,",
              "        s:size",
              "      });",
              "    }",
              "  }",
              "  return out;",
              "})();"
          ])
          s, n = re.subn(r"const darkForest=\(\(\)=>\{.*?\n\}\)\(\);", dense_forest, s, count=1, flags=re.S)
          assert n == 1, f'dark forest patch {n}'

          road_draw = "\n".join([
              "function drawRoadTiles(){",
              "  ctx.save();",
              "  const x0=-camera.x,y0=7*TILE-camera.y,w=CONFIG.villageCols*TILE,h=2*TILE;",
              "  ctx.fillStyle='#a89473';ctx.fillRect(x0-4,y0-5,w+8,h+10);",
              "  ctx.fillStyle='#505758';ctx.fillRect(x0,y0,w,h);",
              "  ctx.fillStyle='rgba(220,225,218,.12)';ctx.fillRect(x0,y0+4,w,3);",
              "  ctx.fillStyle='#d9ca83';",
              "  for(let x=10;x<w-10;x+=46)ctx.fillRect(x0+x,y0+h/2-2,28,4);",
              "  const px=4*TILE-camera.x,py=9*TILE-camera.y,pw=6*TILE,ph=3*TILE;",
              "  ctx.fillStyle='#a89473';ctx.fillRect(px-4,py-3,pw+8,ph+6);",
              "  ctx.fillStyle='#505758';ctx.fillRect(px,py,pw,ph);",
              "  ctx.restore();",
              "}",
              ""
          ])
          s, n = re.subn(r"function drawRoadTiles\(\)\{.*?\n\}\nfunction drawConifer", road_draw + "function drawConifer", s, count=1, flags=re.S)
          assert n == 1, f'road draw patch {n}'

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check prototype/v3/game-v31-source.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/v3/game-v31-source.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extend straight road and fill all dark terrain with forest"
            git push
          fi
