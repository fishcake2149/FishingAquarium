name: Apply v3.9 visible village path network

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v35-bus-road.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build visible paths between village buildings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('prototype/v3/game-v31-source.js')
          s = p.read_text(encoding='utf-8')

          old_lower = "addH(18,103,40,3);addV(38,40,43,3);addV(37,40,62,3);addV(38,40,86,3);addV(40,54,30,3);addH(18,45,54,3);addV(54,66,30,3);addH(30,45,66,3);addV(40,53,102,3);addH(99,102,53,3);addV(53,58,99,3);addH(92,102,58,3);"
          new_lower = "addH(18,103,40,3);addV(39,40,43,3);addV(38,40,62,3);addV(39,40,86,3);addV(40,54,19,3);addH(19,31,54,3);addV(54,66,31,3);addV(40,53,102,3);addH(99,102,53,3);addV(53,58,99,3);addH(92,102,58,3);"
          assert old_lower in s, 'current lower village path block not found'
          s = s.replace(old_lower, new_lower, 1)

          old_draw = "for(const [key] of pathTiles){const[tx,ty]=key.split(',').map(Number),x=tx*TILE,y=ty*TILE;if(!visible(rect(x,y,TILE,TILE),32))continue;const n=(tx*17+ty*29)%5;ctx.fillStyle=['#d9bd82','#e1c98f','#cfb276','#e4cb91','#d6bb7f'][n];ctx.fillRect(x,y,TILE,TILE);ctx.strokeStyle='rgba(83,61,39,.38)';ctx.strokeRect(x+.5,y+.5,TILE-1,TILE-1);ctx.fillStyle='rgba(248,224,173,.26)';ctx.fillRect(x+4+(n*6)%18,y+6+(n*9)%17,6,3)}"
          new_draw = "for(const [key] of pathTiles){const[tx,ty]=key.split(',').map(Number),x=tx*TILE,y=ty*TILE;if(!visible(rect(x,y,TILE,TILE),32))continue;const n=Math.abs((tx*17+ty*29)%5);ctx.fillStyle='#8d6d43';ctx.fillRect(x-2,y-2,TILE+4,TILE+4);ctx.fillStyle=['#c79e62','#d0aa6c','#bd9259','#d5ad6f','#c49a5f'][n];ctx.fillRect(x,y,TILE,TILE);ctx.strokeStyle='rgba(82,55,31,.72)';ctx.lineWidth=1.5;ctx.strokeRect(x+.75,y+.75,TILE-1.5,TILE-1.5);ctx.fillStyle='rgba(246,218,158,.45)';ctx.fillRect(x+4+(n*5)%17,y+5+(n*7)%18,8,3);ctx.fillStyle='rgba(104,72,40,.24)';ctx.fillRect(x+18-(n*2)%9,y+20-(n*3)%8,5,3)}"
          assert old_draw in s, 'current path renderer not found'
          s = s.replace(old_draw, new_draw, 1)

          marker = "for(const f of flowerPatches){if(!isVillageLandPoint(f.x,f.y)||pondNorm(f.x,f.y)<1.1)continue;if(pathTiles.has(`${Math.floor(f.x/TILE)},${Math.floor(f.y/TILE)}`))continue;ctx.fillStyle='#4e7d4e';ctx.fillRect(Math.round(f.x),Math.round(f.y),2,7);ctx.fillStyle=f.c;ctx.fillRect(Math.round(f.x-2),Math.round(f.y-2),6,4)}ctx.restore();"
          replacement = "for(const f of flowerPatches){if(!isVillageLandPoint(f.x,f.y)||pondNorm(f.x,f.y)<1.1)continue;if(pathTiles.has(`${Math.floor(f.x/TILE)},${Math.floor(f.y/TILE)}`))continue;ctx.fillStyle='#4e7d4e';ctx.fillRect(Math.round(f.x),Math.round(f.y),2,7);ctx.fillStyle=f.c;ctx.fillRect(Math.round(f.x-2),Math.round(f.y-2),6,4)}\n  const doorAprons=[[43,39,2,2],[62,38,2,3],[86,39,2,2],[102,53,2,2],[19,54,2,2],[31,66,2,2]];\n  for(const [tx,ty,tw,th] of doorAprons){const x=tx*TILE,y=ty*TILE;ctx.fillStyle='#8d6d43';ctx.fillRect(x-3,y-3,tw*TILE+6,th*TILE+6);ctx.fillStyle='#caa065';ctx.fillRect(x,y,tw*TILE,th*TILE);ctx.strokeStyle='rgba(82,55,31,.7)';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,tw*TILE-2,th*TILE-2)}ctx.restore();"
          assert marker in s, 'path decoration marker not found'
          s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')

          index = Path('prototype/v3/index.html')
          h = index.read_text(encoding='utf-8')
          h = re.sub(r'game-v31-source\.js\?v=[^\"\']+', 'game-v31-source.js?v=20260915-10', h, count=1)
          index.write_text(h, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check prototype/v3/game-v31-source.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/v3/game-v31-source.js prototype/v3/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add clear connected paths between village buildings"
            git push
          fi
