name: Materialize v2 readable source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-v2-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild readable game source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          root = Path('prototype/v2')
          encoded = ''.join((root / 'payload' / f'game-{i:02d}.txt').read_text().strip() for i in range(1, 7))
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          (root / 'game-source.js').write_text(source, encoding='utf-8')
          index = (root / 'index.html').read_text(encoding='utf-8')
          index = index.replace('<script src="./game.js"></script>', '<script src="./game-source.js"></script>')
          (root / 'index.html').write_text(index, encoding='utf-8')
          PY
      - name: Commit readable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/v2/game-source.js prototype/v2/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize readable v2 game source"
          git push
